<!-- REACT ENGINE CODE COMPILING DYNAMIC STATE WIDGET -->
<script type="text/babel">
  function ReactBadge() {
    const [likes, setLikes] = React.useState(0);
    return (
      <div style={{
        padding: '15px', 
        backgroundColor: 'rgba(13, 148, 136, 0.08)', 
        border: '1px dashed #0d9488', 
        borderRadius: '8px',
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        flexWrap: 'wrap',
        gap: '10px',
        width: '100%'
      }}>
        <div style={{ textAlign: 'left' }}>
          <span style={{ fontSize: '0.9rem', color: '#34d399', fontWeight: 'bold', display: 'block' }}>✓ React.js UI Component Active</span>
          <p style={{ margin: '0', fontSize: '0.85rem', opacity: 0.8, color: '#fff' }}>This tracking card manages interface interactions inside your static Hugo configuration file.</p>
        </div>
        <button 
          onClick={function() { setLikes(likes + 1); }}
          style={{
            backgroundColor: '#0d9488',
            color: '#fff',
            border: 'none',
            padding: '8px 14px',
            borderRadius: '4px',
            cursor: 'pointer',
            fontSize: '0.85rem',
            fontWeight: '600'
          }}
        >
          👍 Endorse Profile ({likes})
        </button>
      </div>
    );
  }

  const container = document.getElementById('react-interactive-root');
  const root = ReactDOM.createRoot(container);
  root.render(React.createElement(ReactBadge));
</script>
"""

