baseURL = "https://Elma727.github.io/"
languageCode = "en-us"
title = "Sorifa Alam | Data Science Portfolio"
theme = "hugo-profile"

[params]
  # Top Navbar Navigation Title
  [params.navbar]
    enable = true
    brandName = "Sorifa Alam"

  # Profile Main Banner Section
  [params.home]
    enable = true
    name = "Sorifa Alam"
    profession = "M.Sc. Data Science Student & Researcher"
    bio = "Core research and project experience spanning across advanced machine learning model architecture, deep learning frameworks, and deep graph neural networks for security. Passionate about academic writing."
