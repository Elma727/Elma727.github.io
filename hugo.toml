    <p style="font-size: 0.9rem; opacity: 0.8;">Presented at the 11th IEEE International Women in Engineering (WIE) Conference on Electrical and Computer Engineering (WIECON-ECE 2025).</p>
  </div>

  <br>
  <div style="width: 100%; display: block; margin-top: 20px;">
    <h3 style="border-bottom: 2px solid #0d9488; padding-bottom: 5px; color: #0d9488;">🎓 Education</h3>
    <div style="margin-top: 10px; margin-bottom: 15px;">
      <p style="margin-bottom: 2px;"><strong>M.Sc. in Computer Science and Engineering (Data Science)</strong></p>
      <p style="font-size: 0.9rem; opacity: 0.8;">Daffodil International University | May 2026 - Present</p>
    </div>
    <div style="margin-top: 10px;">
      <p style="margin-bottom: 2px;"><strong>B.Sc. in Computing and Information Systems (AI in IoT)</strong></p>
      <p style="font-size: 0.9rem; opacity: 0.8;">Daffodil International University | Graduated: January 2026 — <strong style="color: #0d9488;">CGPA: 3.89/4.00</strong></p>
