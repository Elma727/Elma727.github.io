  <br>
  <div style="width: 100%; display: block; margin-top: 20px;">
    <h3 style="border-bottom: 2px solid #0d9488; padding-bottom: 5px; color: #0d9488;">📚 Publications</h3>
    <p style="margin-top: 10px; margin-bottom: 5px;"><strong>Enhanced Linux Malware Detection Using Control Flow Graphs with Graph2Vec Embedding and Graph Attention Networks</strong></p>
