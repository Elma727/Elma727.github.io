baseURL = "https://github.io"
languageCode = "en-us"
title = "Sorifa Alam | Data Science Portfolio"
theme = "hugo-profile"

[params]
  # Top Navbar Navigation
  [params.navbar]
    enable = true
    brandName = "Sorifa Alam"

  # Profile Main Banner Section
  [params.home]
    enable = true
    name = "Sorifa Alam"
    profession = "M.Sc. Data Science Student & Researcher"
    bio = "Core research and project experience spanning across advanced machine learning model architecture, deep learning frameworks, and deep graph neural networks for security. Passionate about academic writing."
    image = "https://github.com"

  # Beautiful Custom "About Me" and CV Sections
  [params.about]
    enable = true
    title = "Academic & Professional Portfolio"
    content = """
    <div style="font-family: inherit; color: inherit; line-height: 1.8;">
      
      <!-- Profile Intro Card -->
      <p style="margin-bottom: 25px;">I'm an M.Sc. student in Computer Science and Engineering (Major: Data Science) at Daffodil International University where I also completed my B.Sc. in Computing and Information Systems (Major: Artificial Intelligence in IoT) with a CGPA of 3.89/4.00. My core research spans advanced machine learning architecture, deep learning frameworks, and deep graph neural networks for security.</p>
      
      <!-- Publications Block -->
      <h3 style="color: #0d9488; font-size: 1.3rem; margin-top: 30px; margin-bottom: 10px; border-bottom: 2px solid #0d9488; padding-bottom: 5px;">📚 Publications</h3>
      <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <strong style="font-size: 1.05rem;">Enhanced Linux Malware Detection Using Control Flow Graphs with Graph2Vec Embedding and Graph Attention Networks</strong><br>
        <span style="font-size: 0.9rem; opacity: 0.85;">Sorifa Alam, Francis Rudra D Cruze, Rakibul Hasan Nirob, & Md. Ruhul Kuddus</span><br>
        <span style="font-size: 0.85rem; color: #34d399;">Presented at the 11th IEEE International Women in Engineering (WIE) Conference (WIECON-ECE 2025)</span>
      </div>

      <!-- Education Block -->
      <h3 style="color: #0d9488; font-size: 1.3rem; margin-top: 30px; margin-bottom: 10px; border-bottom: 2px solid #0d9488; padding-bottom: 5px;">🎓 Education</h3>
      <ul style="list-style-type: none; padding-left: 0;">
        <li style="margin-bottom: 12px;"><strong>M.Sc. in Computer Science and Engineering (Data Science)</strong><br><span style="font-size: 0.9rem; opacity: 0.8;">Daffodil International University | May 2026 - Present</span></li>
        <li style="margin-bottom: 12px;"><strong>B.Sc. in Computing and Information Systems (AI in IoT)</strong><br><span style="font-size: 0.9rem; opacity: 0.8;">Daffodil International University | Graduated: January 2026 — <strong style="color: #34d399;">CGPA: 3.89/4.00</strong></span></li>
      </ul>

      <!-- Experience & Leadership Block -->
      <h3 style="color: #0d9488; font-size: 1.3rem; margin-top: 30px; margin-bottom: 10px; border-bottom: 2px solid #0d9488; padding-bottom: 5px;">💼 Experiences & Leadership</h3>
      <ul style="list-style-type: none; padding-left: 0;">
        <li style="margin-bottom: 15px;"><strong>Women Secretary — DIU Robotics Club</strong> (2024 - 2025)<br><span style="font-size: 0.9rem; opacity: 0.85;">Led strategic initiatives to increase female student enrollment and active participation in robotics engineering, programming, and hardware design workshops. Co-managed inter-university robotics competitions.</span></li>
        <li style="margin-bottom: 15px;"><strong>Education Abroad Ambassador — Graduate Consultancy</strong> (2024 - 2025)<br><span style="font-size: 0.9rem; opacity: 0.85;">Guided prospective students through global university selection processes, entry criteria analysis, visa application protocols, and documentation preparation.</span></li>
      </ul>

      <!-- Key Projects Block -->
      <h3 style="color: #0d9488; font-size: 1.3rem; margin-top: 30px; margin-bottom: 10px; border-bottom: 2px solid #0d9488; padding-bottom: 5px;">🧠 Key Projects</h3>
      <ul style="list-style-type: none; padding-left: 0;">
        <li style="margin-bottom: 12px;"><strong>LeadGenius AI:</strong> All-in-One Sales & Marketing Assistant deploying 9 autonomous, collaborative AI agents running cleanly with zero execution latency.</li>
        <li style="margin-bottom: 12px;"><strong>Disease & Diagnostics ML Systems:</strong> Developed custom classification and prediction frameworks for Parkinson's Tracking, Autism Prediction, and Diabetes Risk Modeling.</li>
      </ul>

    </div>
    """

  # Footer Contact Details
  [params.contact]
    enable = true
    email = "262-25-008@diu.edu.bd"
    phone = "+8801300981028"
    address = "Tongi-Gazipur, Bangladesh"
    github = "https://github.com"
