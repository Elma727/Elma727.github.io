name: Deploy Hugo site to Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Hugo CLI
        run: |
          HUGO_VERSION=0.128.0
          wget https://github.com{HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo_extended_${HUGO_VERSION}_linux-amd64.deb          
      - name: Download Portfolio Theme
        run: |
          mkdir -p themes
          git clone https://github.com themes/hugo-profile          
      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Website
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Live Link
        id: deployment
        uses: actions/deploy-pages@v4
